<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Escolar de Voleibol · XOGADE</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCVWqKhqlb2_MgG_jDnYkXLjD6BiL4Ueeo",
    authDomain:        "xogade-voley.firebaseapp.com",
    databaseURL:       "https://xogade-voley-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "xogade-voley",
    storageBucket:     "xogade-voley.firebasestorage.app",
    messagingSenderId: "679961729438",
    appId:             "1:679961729438:web:05821372d8373ffbd19e8f"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // Expose to global scope so the rest of the app can call them
  window._fbSave = async function(data) {
    await set(ref(db, 'liga'), data);
  };

  window._fbLoad = async function() {
    const snap = await get(ref(db, 'liga'));
    return snap.exists() ? snap.val() : null;
  };

  window._fbReady = true;
  // Dispatch event so the app knows Firebase is ready
  window.dispatchEvent(new Event('firebaseReady'));
</script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────────────────── */
:root {
  --cyan:        #00AEEF;
  --cyan-d:      #0088c4;
  --cyan-l:      #d0f0fc;
  --magenta:     #E5007E;
  --magenta-d:   #b8005e;
  --magenta-l:   #fce0ee;
  --green:       #22c55e;
  --red:         #ef4444;
  --bg:          #f0f8ff;
  --surface:     #ffffff;
  --surface2:    #e8f4fb;
  --border:      #b8ddf0;
  --text:        #1a2a3a;
  --muted:       #5a7a9a;
  --alevfem:     #E5007E;
  --alevmas:     #00AEEF;
  --benjfem:     #9b30c0;
  --benjmas:     #00b87c;
  --r:           16px;   /* border-radius base */
  --gap:         clamp(12px, 3vw, 24px);
  --pad:         clamp(12px, 4vw, 40px);
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }

/* Subtle dot pattern */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(0,174,239,.07) 1px, transparent 1px),
    radial-gradient(circle, rgba(229,0,126,.05) 1px, transparent 1px);
  background-size: 32px 32px, 64px 64px;
  background-position: 0 0, 16px 16px;
}
.app-wrapper { position: relative; z-index: 1; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.site-header {
  position: sticky; top: 0; z-index: 200;
  background: #fff;
  border-bottom: 3px solid var(--cyan);
  box-shadow: 0 2px 16px rgba(0,174,239,.12);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 var(--pad);
  height: 56px;          /* altura fija — nunca crece */
}

.header-logo { height: 36px; width: auto; flex-shrink: 0; }

.header-divider {
  width: 1.5px; align-self: stretch;
  background: var(--border);
  margin: 10px 4px;
  flex-shrink: 0;
}

.header-title {
  flex: 1; min-width: 0;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: clamp(.85rem, 2.5vw, 1.35rem);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1;
}
.header-title .c { color: var(--cyan-d); }
.header-title .m { color: var(--magenta); }

.header-right {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
#headerBtns {
  display: flex; align-items: center; gap: 6px;
}

.role-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 100px;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: clamp(.65rem, 2vw, .78rem); white-space: nowrap;
}
.role-pill.admin { background: var(--magenta-l); color: var(--magenta); border: 1.5px solid rgba(229,0,126,.3); }
.role-pill.guest  { background: var(--cyan-l);    color: var(--cyan-d);  border: 1.5px solid rgba(0,174,239,.3); }

.btn-out {
  background: none; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 4px 10px; color: var(--muted);
  font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: clamp(.65rem, 2vw, .78rem); white-space: nowrap;
  transition: all .15s;
}
.btn-out:hover { border-color: var(--magenta); color: var(--magenta); }

/* ── STEPS BAR ───────────────────────────────────────────────────────────── */
.steps-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 var(--pad);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.steps-bar::-webkit-scrollbar { display: none; }

.step-btn {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 12px 16px; white-space: nowrap;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: .82rem; color: var(--muted);
  transition: all .2s;
}
.step-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.step-btn.done   { color: var(--magenta); }
.step-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── MAIN ────────────────────────────────────────────────────────────────── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--gap) var(--pad);
}

/* ── ANIMATIONS ──────────────────────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}

/* ── SETUP CARD ──────────────────────────────────────────────────────────── */
.setup-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--r);
  padding: clamp(20px, 5vw, 40px);
  max-width: 620px;
  margin: 0 auto;
  box-shadow: 0 4px 24px rgba(0,174,239,.08);
  animation: fadeUp .35s ease;
}

.cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }

.cat-badge {
  display: inline-flex; align-items: center;
  padding: 5px 14px; border-radius: 100px;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: .75rem; text-transform: uppercase; letter-spacing: .8px;
}
.badge-alevfem { background: var(--magenta-l); color: var(--magenta); border: 1.5px solid rgba(229,0,126,.25); }
.badge-alevmas { background: var(--cyan-l);    color: var(--cyan-d);  border: 1.5px solid rgba(0,174,239,.3); }
.badge-benjfem { background: #f3e8fa; color: #9b30c0; border: 1.5px solid rgba(155,48,192,.25); }
.badge-benjmas { background: #e0f8f0; color: #00b87c; border: 1.5px solid rgba(0,184,124,.3); }

.setup-card h2 {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: clamp(1.2rem, 4vw, 1.7rem); margin-bottom: 6px;
}
.setup-card .sub { color: var(--muted); font-size: .9rem; margin-bottom: 24px; line-height: 1.6; }

.team-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.team-row {
  display: flex; gap: 8px; align-items: center;
  animation: fadeUp .25s ease;
}
.team-row input {
  flex: 1;
  background: var(--surface2); border: 2px solid var(--border); border-radius: 10px;
  padding: 11px 14px; color: var(--text);
  font-family: 'Nunito Sans', sans-serif; font-size: .95rem; font-weight: 600;
  outline: none; transition: border-color .2s;
}
.team-row input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,174,239,.1); }
.team-row input::placeholder { color: #aac4d8; }

.btn-rm {
  width: 34px; height: 34px; flex-shrink: 0;
  background: var(--magenta-l); border: 1.5px solid rgba(229,0,126,.2);
  border-radius: 8px; color: var(--magenta); font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.btn-rm:hover { background: rgba(229,0,126,.2); }

.btn-add-team {
  width: 100%; background: none; border: 2px dashed var(--border);
  border-radius: 10px; padding: 10px;
  color: var(--muted); font-size: .88rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
}
.btn-add-team:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-l); }

.fmt-label {
  display: block; color: var(--muted); font-size: .78rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
  font-family: 'Nunito', sans-serif;
}
.fmt-opts { display: flex; gap: 10px; margin-bottom: 24px; }
.fmt-opt {
  flex: 1; padding: 14px 10px; text-align: center;
  background: var(--surface2); border: 2px solid var(--border); border-radius: 12px;
  cursor: pointer; transition: all .2s;
}
.fmt-opt:hover  { border-color: var(--cyan); }
.fmt-opt.sel    { border-color: var(--cyan); background: var(--cyan-l); }
.fmt-opt-title  { font-weight: 800; font-size: .95rem; font-family: 'Nunito', sans-serif; }
.fmt-opt-desc   { color: var(--muted); font-size: .76rem; margin-top: 3px; }

/* ── BUTTONS ─────────────────────────────────────────────────────────────── */
.btn-primary {
  background: linear-gradient(135deg, var(--magenta), var(--magenta-d));
  border: none; border-radius: 10px; padding: 13px 24px;
  color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .92rem;
  transition: all .2s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(229,0,126,.3); }

.btn-secondary {
  background: var(--surface2); border: 2px solid var(--border); border-radius: 10px;
  padding: 13px 24px; color: var(--text);
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .92rem;
  transition: all .2s;
}
.btn-secondary:hover { border-color: var(--cyan); color: var(--cyan-d); }

.btn-row { display: flex; gap: 10px; justify-content: flex-end; }

/* ── COMPETITION ─────────────────────────────────────────────────────────── */

/* Overview grid: 4 cols desktop → 2 cols tablet → 2 cols mobile */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: var(--gap);
}
@media (max-width: 700px) {
  .overview-grid { grid-template-columns: repeat(2, 1fr); }
}

.ov-card {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--r);
  padding: 16px 14px; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.ov-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.ov-card.alevfem::before { background: var(--alevfem); }
.ov-card.alevmas::before { background: var(--alevmas); }
.ov-card.benjfem::before { background: var(--benjfem); }
.ov-card.benjmas::before { background: var(--benjmas); }
.ov-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,174,239,.15); }

.ov-cat {
  font-size: .7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .8px; margin-bottom: 5px; font-family: 'Nunito', sans-serif;
}
.ov-cat.alevfem { color: var(--alevfem); }
.ov-cat.alevmas { color: var(--cyan-d); }
.ov-cat.benjfem { color: var(--benjfem); }
.ov-cat.benjmas { color: var(--benjmas); }

.ov-leader { font-weight: 800; font-size: clamp(.85rem, 2vw, 1rem); font-family: 'Nunito', sans-serif; }
.ov-sub    { color: var(--muted); font-size: .75rem; margin-top: 3px; }




.action-btns { display: flex; gap: 8px; flex-shrink: 0; }

.btn-save {
  background: linear-gradient(135deg, var(--green), #16a34a);
  border: none; border-radius: 8px; padding: 6px 12px;
  color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .78rem;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
  transition: all .2s;
}
.btn-save:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(34,197,94,.3); }
.btn-save.saved { background: linear-gradient(135deg, var(--cyan-d), #006a9e); }
.btn-save:disabled { opacity: .7; transform: none; }

.btn-print {
  background: var(--surface); border: 2px solid var(--border); border-radius: 8px;
  padding: 6px 10px; color: var(--muted);
  font-size: .9rem; white-space: nowrap; transition: all .2s;
}
.btn-print:hover { border-color: var(--magenta); color: var(--magenta); background: var(--magenta-l); }

.btn-reset {
  background: none; border: 2px solid #fca5a5; border-radius: 8px;
  padding: 6px 10px; color: var(--red); font-size: .9rem;
  white-space: nowrap; transition: all .2s;
}
.btn-reset:hover { background: #fee2e2; }

/* Competition layout: 2 cols desktop → 1 col mobile */
.comp-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  animation: fadeUp .35s ease;
}
@media (max-width: 750px) {
  .comp-layout { grid-template-columns: 1fr; }
}

.panel {
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,174,239,.07);
}
.panel-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 2px solid var(--border);
  background: var(--surface2);
}
.panel-head h3 {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: 1rem; color: var(--text);
}
.panel-body { padding: 16px 18px; }

/* Format pill */
.fmt-pill {
  margin-left: auto;
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 100px;
  background: var(--magenta-l); border: 1px solid rgba(229,0,126,.2);
  color: var(--magenta); font-size: .72rem; font-weight: 800;
  font-family: 'Nunito', sans-serif;
}

/* Jornada label */
.jornada-lbl {
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: .72rem; text-transform: uppercase; letter-spacing: .8px;
  color: var(--muted); padding: 10px 0 4px;
}

/* Match row */
.match-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(184,221,240,.5);
}
.match-row:last-child { border-bottom: none; }

.m-team          { font-weight: 700; font-size: .88rem; }
.m-team.right    { text-align: right; }
.m-team.winner   { color: var(--text); font-weight: 800; }
.m-team.loser    { color: var(--muted); font-weight: 600; }

.m-center {
  display: flex; align-items: center; justify-content: center; gap: 5px;
}

.score-show {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: 1.3rem; letter-spacing: 2px;
  color: var(--cyan-d); min-width: 64px; text-align: center;
}

.score-inp {
  width: 42px; background: var(--surface2);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 6px 4px; color: var(--text);
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem;
  text-align: center; outline: none; transition: border-color .2s;
  -moz-appearance: textfield;
}
.score-inp::-webkit-outer-spin-button,
.score-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-inp:focus { border-color: var(--cyan); }
.score-sep { color: var(--muted); font-weight: 900; }

.btn-save-match {
  background: var(--cyan-l); border: 1.5px solid rgba(0,174,239,.4);
  border-radius: 8px; padding: 6px 10px;
  color: var(--cyan-d); font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: .76rem; white-space: nowrap;
  transition: all .15s;
}
.btn-save-match:hover { background: var(--cyan); color: #fff; border-color: var(--cyan); }

.btn-edit {
  background: none; border: none; color: var(--muted);
  font-size: .8rem; padding: 3px 6px; border-radius: 6px;
  transition: all .15s;
}
.btn-edit:hover { color: var(--magenta); background: var(--magenta-l); }

.m-pending { color: var(--muted); font-size: .78rem; font-weight: 700; min-width: 64px; text-align: center; }

/* ── STANDINGS TABLE ─────────────────────────────────────────────────────── */
.standings-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.standings-tbl {
  width: 100%; border-collapse: collapse; font-size: .84rem;
  min-width: 360px;   /* triggers horizontal scroll on tiny screens */
}
.standings-tbl th {
  padding: 8px 6px; text-align: center;
  color: var(--muted); font-weight: 800; font-size: .7rem;
  text-transform: uppercase; letter-spacing: .7px;
  border-bottom: 2px solid var(--border);
  font-family: 'Nunito', sans-serif;
}
.standings-tbl th:first-child,
.standings-tbl td:first-child { text-align: left; padding-left: 2px; }
.standings-tbl th:nth-child(2),
.standings-tbl td:nth-child(2) { text-align: left; }

.standings-tbl td {
  padding: 9px 6px; text-align: center;
  border-bottom: 1px solid rgba(184,221,240,.4);
}
.standings-tbl tr:last-child td { border-bottom: none; }
.standings-tbl tbody tr:hover { background: var(--cyan-l); }

.pos { font-weight: 800; font-family: 'Nunito', sans-serif; }
.pos-1 { color: #b8860b; }
.pos-2 { color: #7a8fa8; }
.pos-3 { color: #8b5e3c; }
.t-name { font-weight: 700; }
.t-pts  { font-weight: 900; color: var(--magenta); font-family: 'Nunito', sans-serif; font-size: .95rem; }
.t-sd   { font-weight: 700; }

/* ── GUEST BANNER ────────────────────────────────────────────────────────── */
.guest-banner {
  background: var(--cyan-l); border: 2px solid rgba(0,174,239,.25);
  border-radius: 12px; padding: 12px 16px; margin-bottom: var(--gap);
  display: flex; align-items: flex-start; gap: 10px;
  font-size: .86rem; font-weight: 700; color: var(--cyan-d); line-height: 1.4;
}

/* ── TOAST ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 20px; z-index: 9000;
  background: var(--surface); border: 2px solid var(--cyan); border-radius: 12px;
  padding: 12px 18px; font-size: .88rem; font-weight: 700; color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  transform: translateX(calc(100% + 24px));
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  max-width: min(320px, calc(100vw - 32px));
}
.toast.show { transform: translateX(0); }

/* ── LOGIN SCREEN ────────────────────────────────────────────────────────── */
#loginScreen {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #e8f6fd 0%, #fce8f3 100%);
  padding: 16px;
  overflow-y: auto;
}
#loginScreen::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, rgba(0,174,239,.10) 1px, transparent 1px),
    radial-gradient(circle, rgba(229,0,126,.07) 1px, transparent 1px);
  background-size: 28px 28px, 56px 56px;
}

.login-card {
  position: relative;
  background: #fff; border-radius: 20px; border: 2px solid var(--border);
  padding: clamp(24px, 6vw, 48px) clamp(20px, 6vw, 44px);
  width: 100%; max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,174,239,.18);
  animation: fadeUp .4s cubic-bezier(.34,1.56,.64,1);
  text-align: center;
}

.login-logo { margin-bottom: 18px; }
.login-logo img { height: clamp(48px, 12vw, 72px); width: auto; }

.login-title {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--text);
  line-height: 1.2; margin-bottom: 4px;
}
.login-title .c { color: var(--cyan-d); }
.login-title .m { color: var(--magenta); }

.login-sub {
  color: var(--muted); font-size: .84rem; font-weight: 600;
  margin-bottom: 28px;
}

.login-fb-msg {
  background: var(--cyan-l); border: 2px solid rgba(0,174,239,.3);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
  font-size: .82rem; font-weight: 700; color: var(--cyan-d);
  display: flex; align-items: center; gap: 8px;
}

.btn-login {
  width: 100%; background: none; border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; text-align: left;
  transition: all .2s; margin-bottom: 12px;
}
.btn-login:last-child { margin-bottom: 0; }
.btn-login.guest {
  background: var(--cyan-l); border: 2px solid rgba(0,174,239,.3);
}
.btn-login.guest:not(:disabled):hover {
  background: var(--cyan); border-color: var(--cyan);
}
.btn-login.admin {
  background: var(--magenta-l); border: 2px solid rgba(229,0,126,.3);
}
.btn-login.admin:not(:disabled):hover {
  background: var(--magenta); border-color: var(--magenta);
}
.btn-login:not(:disabled):hover .bl-title,
.btn-login:not(:disabled):hover .bl-desc { color: #fff; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

.bl-icon {
  width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
}
.bl-icon.g { background: rgba(0,174,239,.15); }
.bl-icon.a { background: rgba(229,0,126,.15); }

.bl-title {
  display: block; font-weight: 800; font-size: .95rem;
  color: var(--text); transition: color .2s;
}
.bl-desc {
  display: block; font-size: .76rem; color: var(--muted);
  margin-top: 2px; font-weight: 600; transition: color .2s;
}

.login-divider {
  display: flex; align-items: center; gap: 10px; margin: 4px 0 16px;
  color: var(--muted); font-size: .74rem; font-weight: 700; text-transform: uppercase;
}
.login-divider::before, .login-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── PASSWORD MODAL ──────────────────────────────────────────────────────── */
#pwdModal {
  position: fixed; inset: 0; z-index: 99999;
  display: none; align-items: center; justify-content: center;
  background: rgba(10,20,40,.45); backdrop-filter: blur(4px);
  padding: 16px;
}
#pwdModal.open { display: flex; }

.pwd-card {
  background: #fff; border-radius: 18px; border: 2px solid var(--border);
  padding: clamp(24px, 6vw, 36px);
  width: 100%; max-width: 360px;
  box-shadow: 0 16px 48px rgba(0,0,0,.2);
  animation: fadeUp .3s ease; text-align: center;
}
.pwd-card h3 {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: 1.2rem; margin-bottom: 4px;
}
.pwd-card p { color: var(--muted); font-size: .84rem; margin-bottom: 18px; font-weight: 600; }

.pwd-input {
  width: 100%; background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; padding: 12px 16px; color: var(--text);
  font-family: 'Nunito Sans', sans-serif; font-size: 1rem; font-weight: 700;
  letter-spacing: 3px; text-align: center; outline: none;
  transition: border-color .2s; margin-bottom: 10px;
}
.pwd-input:focus  { border-color: var(--magenta); box-shadow: 0 0 0 3px rgba(229,0,126,.1); }
.pwd-input.error  { border-color: var(--red); animation: shake .35s ease; }

.pwd-err { color: var(--red); font-size: .8rem; font-weight: 700; min-height: 18px; margin-bottom: 10px; }

.pwd-btns { display: flex; gap: 8px; }
.pwd-cancel {
  flex: 1; background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; padding: 11px;
  color: var(--muted); font-family: 'Nunito', sans-serif; font-weight: 800;
  transition: all .15s;
}
.pwd-cancel:hover { border-color: var(--muted); color: var(--text); }
.pwd-ok {
  flex: 2; background: linear-gradient(135deg, var(--magenta), var(--magenta-d));
  border: none; border-radius: 10px; padding: 11px;
  color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900;
  transition: all .15s;
}
.pwd-ok:hover { opacity: .9; transform: translateY(-1px); }

/* ── PRINT ───────────────────────────────────────────────────────────────── */

/* ── ADMIN ACCESS BUTTON ─────────────────────────────────────────────────── */
.btn-admin-access {
  background: var(--magenta-l);
  border: 2px solid rgba(229,0,126,.35);
  border-radius: 8px; padding: 6px 12px;
  color: var(--magenta);
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .78rem;
  white-space: nowrap; transition: all .2s;
}
.btn-admin-access:hover { background: var(--magenta); color: #fff; border-color: var(--magenta); }

/* ── ACTION BAR (no tabs now) ────────────────────────────────────────────── */
.action-bar {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 8px; margin-bottom: var(--gap); flex-wrap: wrap;
}
.action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── LEADER LABEL ────────────────────────────────────────────────────────── */
.ov-ldr-label {
  font-size: .65rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .8px; color: var(--muted);
  font-family: 'Nunito', sans-serif; margin-bottom: 1px;
}

@media print {
  *, *::before, *::after { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; color: #111; font-family: sans-serif; }
  body::before { display: none; }
  .site-header, .steps-bar, .overview-grid, .action-bar,
  .btn-save-match, .btn-edit, .score-inp, .score-sep,
  #loginScreen, #pwdModal, .toast { display: none !important; }
  main { padding: 0; max-width: 100%; }
  .comp-layout { display: none !important; }
  #printArea { display: block !important; }
  .print-section { page-break-inside: avoid; margin-bottom: 28px; }
  .print-logo-row { display: flex !important; align-items: center; gap: 14px; margin-bottom: 18px; border-bottom: 3px solid #00AEEF; padding-bottom: 10px; }
  .print-logo-row img { height: 46px; }
  .print-logo-row h2 { font-size: 1.2rem; font-weight: 900; }
  .print-logo-row p  { font-size: .78rem; color: #5a7a9a; }
  .print-cat { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; border-left: 5px solid #E5007E; padding-left: 8px; margin-bottom: 12px; }
  .print-meta { font-size: .78rem; color: #555; font-weight: 700; margin-bottom: 10px; }
  .print-cols { display: flex; gap: 28px; }
  .print-col { flex: 1; }
  .print-sub { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: #5a7a9a; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: .78rem; }
  th { background: #e8f4fb !important; padding: 6px; text-align: center; border: 1px solid #b8ddf0; font-weight: 800; }
  th:first-child, th:nth-child(2), td:first-child, td:nth-child(2) { text-align: left; }
  td { padding: 5px 6px; border: 1px solid #d4ecf7; text-align: center; }
  .pm-row { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid #e8f4fb; font-size: .78rem; gap: 6px; }
  .pm-team { flex: 1; }
  .pm-team.r { text-align: right; }
  .pm-score { font-weight: 900; min-width: 56px; text-align: center; color: #0088c4; }
  .pm-pend  { color: #aac4d8; font-style: italic; }
  .j-lbl { font-size: .68rem; font-weight: 800; text-transform: uppercase; color: #5a7a9a; padding: 7px 0 2px; }
}
</style>
</head>

<div id="pwdModal">
  <div class="pwd-card">
    <div style="font-size:2rem;margin-bottom:10px">🔐</div>
    <h3>Contraseña de administrador</h3>
    <p>Introduce la clave para acceder al modo edición</p>
    <input type="password" class="pwd-input" id="pwdInput" placeholder="••••••"
      onkeydown="if(event.key==='Enter')checkPwd()">
    <div class="pwd-err" id="pwdErr"></div>
    <div class="pwd-btns">
      <button class="pwd-cancel" onclick="closePwdModal()">Cancelar</button>
      <button class="pwd-ok" onclick="checkPwd()">Entrar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════════
const ADMIN_PASSWORD = 'XOGADE';
let currentRole = 'guest';  // starts as guest, no login screen needed

function showPwdModal() {
  document.getElementById('pwdModal').classList.add('open');
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdErr').textContent = '';
  setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}
function closePwdModal() { document.getElementById('pwdModal').classList.remove('open'); }

function checkPwd() {
  const v = document.getElementById('pwdInput').value;
  if (v === ADMIN_PASSWORD) {
    currentRole = 'admin';
    closePwdModal();
    enterApp();
    return;
  }
  const inp = document.getElementById('pwdInput');
  document.getElementById('pwdErr').textContent = '❌ Contraseña incorrecta';
  inp.classList.add('error');
  inp.value = '';
  setTimeout(() => inp.classList.remove('error'), 400);
  inp.focus();
}

function updateHeaderBtns() {
  const badge = document.getElementById('roleBadge');
  const btns  = document.getElementById('headerBtns');
  if (currentRole === 'admin') {
    badge.style.display = 'inline-flex';
    badge.className = 'role-pill admin';
    badge.innerHTML = '🔐 Admin';
    btns.innerHTML =
      '<button id="saveBtn" class="btn-save" onclick="saveState()">💾 Guardar</button>' +
      '<button class="btn-print" onclick="printResults()">🖨️</button>' +
      '<button class="btn-reset" onclick="clearSavedState()" title="Reiniciar">🗑️</button>' +
      '<button class="btn-out" onclick="logout()">Salir</button>';
  } else {
    badge.style.display = 'none';
    btns.innerHTML =
      '<button class="btn-print" onclick="printResults()">🖨️</button>' +
      '<button class="btn-admin-access" onclick="showPwdModal()">🔐 Administrador</button>';
  }
}

async function enterApp() {
  updateHeaderBtns();
  render();
}

function logout() {
  if (!confirm('¿Salir del modo administrador?')) return;
  currentRole = 'guest';
  document.getElementById('stepBtn0').style.display = 'none';
  updateHeaderBtns();
  render();
}

// ═══════════════════════════════════════════════════════════════════════════════
// FIREBASE PERSISTENCE
// ═══════════════════════════════════════════════════════════════════════════════
let _fbReady = false;
window.addEventListener('firebaseReady', () => { _fbReady = true; });

async function waitFb(ms=8000) {
  if (_fbReady) return true;
  return new Promise(res => {
    const t = setTimeout(() => res(false), ms);
    window.addEventListener('firebaseReady', () => { clearTimeout(t); res(true); });
  });
}

async function saveState() {
  const btn = document.getElementById('saveBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Guardando...'; }
  try {
    await window._fbSave({
      step: state.step, setupStep: state.setupStep,
      activeCategory: state.activeCategory, categories: state.categories,
      savedAt: new Date().toISOString()
    });
    showToast('💾 Guardado — visible para todos los usuarios');
    if (btn) {
      btn.classList.add('saved'); btn.innerHTML = '✅ Guardado'; btn.disabled = false;
      setTimeout(() => { btn.classList.remove('saved'); btn.innerHTML = '💾 Guardar'; }, 3000);
    }
  } catch(e) {
    showToast('⚠️ Error: ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar'; }
  }
}

async function loadState() {
  try {
    const ok = await waitFb();
    if (!ok) { showToast('⚠️ No se pudo conectar con Firebase'); return; }
    const saved = await window._fbLoad();
    if (!saved) return;
    state.step = saved.step || 0;
    state.setupStep = saved.setupStep || 0;
    state.activeCategory = saved.activeCategory || null;
    if (saved.categories) {
      CATEGORIES.forEach(c => { if (saved.categories[c.id]) state.categories[c.id] = saved.categories[c.id]; });
    }
    if (state.step === 1) {
      document.getElementById('stepBtn0').classList.replace('active','done');
      document.getElementById('stepBtn1').classList.add('active');
      document.getElementById('stepBtn1').disabled = false;
    }
  } catch(e) { console.info('No data in Firebase'); }
}

async function clearSavedState() {
  if (!confirm('¿Borrar todos los datos?\nAfectará a todos los usuarios.')) return;
  try { await window._fbSave(null); } catch(e) {}
  state.step = 0; state.setupStep = 0; state.activeCategory = null;
  CATEGORIES.forEach(c => { state.categories[c.id] = { teams:[], format:1, matches:[], setupDone:false }; });
  document.getElementById('stepBtn0').className = 'step-btn active';
  document.getElementById('stepBtn1').className = 'step-btn';
  document.getElementById('stepBtn1').disabled = true;
  render(); showToast('🗑️ Datos borrados para todos los usuarios');
}

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
const CATEGORIES = [
  { id:'alevfem', label:'Alevín Femenino',   badge:'badge-alevfem', color:'alevfem' },
  { id:'alevmas', label:'Alevín Masculino',   badge:'badge-alevmas', color:'alevmas' },
  { id:'benjfem', label:'Benjamín Femenino',  badge:'badge-benjfem', color:'benjfem' },
  { id:'benjmas', label:'Benjamín Masculino', badge:'badge-benjmas', color:'benjmas' },
];

let state = { step:0, setupStep:0, categories:{}, activeCategory:null };
CATEGORIES.forEach(c => { state.categories[c.id] = { teams:[], format:1, matches:[], setupDone:false }; });

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════════════════════════════════════════
function render() {
  const main = document.getElementById('mainContent');
  state.step === 0 ? renderSetup(main) : renderCompetition(main);
}

// ═══════════════════════════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════════════════════════
function renderSetup(main) {
  if (currentRole === 'guest') {
    main.innerHTML = '<div style="text-align:center;padding:80px 20px"><div style="font-size:3.5rem;margin-bottom:16px">🏐</div>' +
      '<h2 style="font-family:Nunito,sans-serif;font-weight:900;font-size:1.5rem;margin-bottom:8px">Competición no disponible aún</h2>' +
      '<p style="color:var(--muted);max-width:380px;margin:0 auto">El administrador todavía no ha configurado las ligas.</p></div>';
    return;
  }
  const idx = state.setupStep;
  if (idx >= CATEGORIES.length) { finishSetup(); return; }
  const cat = CATEGORIES[idx];
  const cd  = state.categories[cat.id];
  if (cd.teams.length < 2) cd.teams = ['', ''];

  main.innerHTML = `
    <div class="setup-card">
      <div class="cat-header">
        <span class="cat-badge ${cat.badge}">${cat.label}</span>
        <span style="color:var(--muted);font-size:.85rem">${idx+1} / ${CATEGORIES.length}</span>
      </div>
      <h2>¿Qué equipos participan?</h2>
      <p class="sub">Introduce los nombres de los equipos de esta categoría (mínimo 2).</p>
      <div class="team-inputs" id="teamInputs">
        ${cd.teams.map((t,i) => `
          <div class="team-row">
            <input type="text" placeholder="Equipo ${i+1}" value="${escHtml(t)}" oninput="updateTeam(${i},this.value)">
            ${i >= 2 ? `<button class="btn-rm" onclick="removeTeam(${i})">×</button>` : ''}
          </div>`).join('')}
      </div>
      <button class="btn-add-team" onclick="addTeam()"><span>＋</span> Añadir equipo</button>
      <div style="margin-top:24px">
        <span class="fmt-label">Formato de liga</span>
        <div class="fmt-opts">
          <div class="fmt-opt ${cd.format===1?'sel':''}" onclick="setFormat(1)">
            <div class="fmt-opt-title">Una vuelta</div>
            <div class="fmt-opt-desc">Cada pareja juega 1 partido</div>
          </div>
          <div class="fmt-opt ${cd.format===2?'sel':''}" onclick="setFormat(2)">
            <div class="fmt-opt-title">Dos vueltas</div>
            <div class="fmt-opt-desc">Ida y vuelta entre todos</div>
          </div>
        </div>
      </div>
      <div class="btn-row">
        ${idx > 0 ? `<button class="btn-secondary" onclick="prevCategory()">← Anterior</button>` : ''}
        <button class="btn-primary" onclick="nextCategory()">
          ${idx < CATEGORIES.length-1 ? 'Siguiente →' : '🏐 Iniciar competición'}
        </button>
      </div>
    </div>`;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function updateTeam(i,v) { state.categories[CATEGORIES[state.setupStep].id].teams[i] = v.trim(); }
function addTeam()    { state.categories[CATEGORIES[state.setupStep].id].teams.push(''); render(); }
function removeTeam(i) { state.categories[CATEGORIES[state.setupStep].id].teams.splice(i,1); render(); }
function setFormat(f)  { state.categories[CATEGORIES[state.setupStep].id].format = f; render(); }

function nextCategory() {
  const cd = state.categories[CATEGORIES[state.setupStep].id];
  document.querySelectorAll('#teamInputs input').forEach((el,i) => { cd.teams[i] = el.value.trim(); });
  const valid = cd.teams.filter(t => t.length > 0);
  if (valid.length < 2) { showToast('⚠️ Introduce al menos 2 equipos'); return; }
  cd.teams = valid; cd.setupDone = true;
  state.setupStep++;
  state.setupStep >= CATEGORIES.length ? finishSetup() : render();
}
function prevCategory() { state.setupStep--; render(); }

function finishSetup() {
  CATEGORIES.forEach(c => {
    const cd = state.categories[c.id];
    cd.matches = generateMatches(cd.teams, cd.format);
  });
  state.step = 1;
  state.activeCategory = CATEGORIES[0].id;
  document.getElementById('stepBtn0').classList.replace('active','done');
  document.getElementById('stepBtn1').classList.add('active');
  document.getElementById('stepBtn1').disabled = false;
  render();
}

function generateMatches(teams, format) {
  const matches = []; let j = 1;
  for (let v = 0; v < format; v++) {
    for (let i = 0; i < teams.length; i++) {
      for (let k = i+1; k < teams.length; k++) {
        matches.push({
          id: `m_${v}_${i}_${k}`,
          local:      v===0 ? teams[i] : teams[k],
          visitante:  v===0 ? teams[k] : teams[i],
          scoreLocal: '', scoreVisitante: '', played: false,
          jornada: Math.ceil(j / Math.ceil(teams.length/2))
        });
        j++;
      }
    }
  }
  return matches;
}

// ═══════════════════════════════════════════════════════════════════════════════
// COMPETITION
// ═══════════════════════════════════════════════════════════════════════════════
function goToStep(s) {
  if (s === 0 && state.step > 0) {
    if (currentRole === 'guest') return;
    if (!confirm('¿Volver a la configuración?')) return;
    state.step = 0; state.setupStep = 0;
    document.getElementById('stepBtn0').className = 'step-btn active';
    document.getElementById('stepBtn1').className = 'step-btn';
    document.getElementById('stepBtn1').disabled = true;
    render();
  }
}

function renderCompetition(main) {
  // Hide setup tab for guests
  document.getElementById('stepBtn0').style.display = currentRole === 'guest' ? 'none' : '';

  const overviewHtml = CATEGORIES.map(cat => {
    const cd = state.categories[cat.id];
    const st = getStandings(cat.id);
    const played = cd.matches.filter(m => m.played).length;
    return `<div class="ov-card ${cat.color}" onclick="switchCat('${cat.id}')">
      <div class="ov-cat ${cat.color}">${cat.label}</div>
      ${st[0]
        ? `<div class="ov-ldr-label">Líder actual</div><div class="ov-leader">${st[0].team}</div>`
        : `<div class="ov-leader" style="color:var(--muted);font-size:.82rem;font-weight:600">Sin datos aún</div>`
      }
      <div class="ov-sub">${played}/${cd.matches.length} partidos</div>
    </div>`;
  }).join('');



  const catId  = state.activeCategory;
  const cat    = CATEGORIES.find(c => c.id === catId);
  const cd     = state.categories[catId];
  const st     = getStandings(catId);

  const byJ = {};
  cd.matches.forEach(m => { (byJ[m.jornada] = byJ[m.jornada]||[]).push(m); });

  const matchesHtml = Object.keys(byJ).sort((a,b)=>a-b).map(j => {
    const rows = byJ[j].map(m => {
      if (m.played) {
        const lw = parseInt(m.scoreLocal) > parseInt(m.scoreVisitante);
        return `<div class="match-row">
          <div class="m-team ${lw?'winner':'loser'}">${escHtml(m.local)}</div>
          <div class="m-center">
            <div class="score-show">${m.scoreLocal} – ${m.scoreVisitante}</div>
            ${currentRole==='admin' ? `<button class="btn-edit" onclick="editMatch('${catId}','${m.id}')" title="Editar">✏️</button>` : ''}
          </div>
          <div class="m-team right ${!lw?'winner':'loser'}">${escHtml(m.visitante)}</div>
        </div>`;
      }
      if (currentRole === 'admin') {
        return `<div class="match-row">
          <div class="m-team">${escHtml(m.local)}</div>
          <div class="m-center">
            <input class="score-inp" type="number" min="0" max="99" id="sl_${m.id}" placeholder="0">
            <span class="score-sep">–</span>
            <input class="score-inp" type="number" min="0" max="99" id="sv_${m.id}" placeholder="0">
            <button class="btn-save-match" onclick="saveMatch('${catId}','${m.id}')">Guardar</button>
          </div>
          <div class="m-team right">${escHtml(m.visitante)}</div>
        </div>`;
      }
      return `<div class="match-row">
        <div class="m-team loser">${escHtml(m.local)}</div>
        <div class="m-center"><span class="m-pending">Pendiente</span></div>
        <div class="m-team right loser">${escHtml(m.visitante)}</div>
      </div>`;
    }).join('');
    return `<div class="jornada-lbl">Jornada ${j}</div>${rows}`;
  }).join('');

  const standingsHtml = st.length > 0 ? `
    <div class="standings-wrap">
      <table class="standings-tbl">
        <thead><tr>
          <th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>SF</th><th>SC</th><th>+/−</th><th>PTS</th>
        </tr></thead>
        <tbody>
          ${st.map((s,i) => `<tr>
            <td><span class="pos ${i===0?'pos-1':i===1?'pos-2':i===2?'pos-3':''}">${i+1}</span></td>
            <td class="t-name">${escHtml(s.team)}</td>
            <td>${s.pj}</td><td>${s.pg}</td><td>${s.pp}</td>
            <td>${s.sf}</td><td>${s.sc}</td>
            <td class="t-sd" style="color:${s.sd>=0?'#22c55e':'#ef4444'}">${s.sd>=0?'+':''}${s.sd}</td>
            <td class="t-pts">${s.pts}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`
    : '<p style="text-align:center;color:var(--muted);padding:24px;font-size:.88rem">Introduce resultados para ver la clasificación.</p>';

  main.innerHTML = `
    <div class="overview-grid">${overviewHtml}</div>

    <div class="comp-layout">
      <div class="panel">
        <div class="panel-head">
          <span class="cat-badge ${cat.badge}">${cat.label}</span>
          <h3>Partidos</h3>
          <span class="fmt-pill">${cd.format===1?'1 vuelta':'2 vueltas'}</span>
        </div>
        <div class="panel-body">${matchesHtml||'<p class="info-msg">Sin partidos.</p>'}</div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>Clasificación</h3>
          <span style="margin-left:auto;font-size:.7rem;color:var(--muted)">2 pts victoria · 1 pt derrota</span>
        </div>
        <div class="panel-body">${standingsHtml}</div>
      </div>
    </div>`;
}

function switchCat(id) { state.activeCategory = id; render(); }

function saveMatch(catId, matchId) {
  const cd = state.categories[catId];
  const m  = cd.matches.find(x => x.id === matchId);
  const sl = parseInt(document.getElementById('sl_'+matchId).value);
  const sv = parseInt(document.getElementById('sv_'+matchId).value);
  if (isNaN(sl)||isNaN(sv)||sl<0||sv<0) { showToast('⚠️ Marcadores no válidos'); return; }
  if (sl===sv) { showToast('⚠️ En voleibol no hay empate'); return; }
  m.scoreLocal = sl; m.scoreVisitante = sv; m.played = true;
  showToast(`✅ ${m.local} ${sl} – ${sv} ${m.visitante}`);
  render();
}

function editMatch(catId, matchId) {
  const m = state.categories[catId].matches.find(x => x.id === matchId);
  m.played = false; m.scoreLocal = ''; m.scoreVisitante = '';
  render();
}

// ═══════════════════════════════════════════════════════════════════════════════
// STANDINGS
// ═══════════════════════════════════════════════════════════════════════════════
function getStandings(catId) {
  const cd = state.categories[catId];
  const t  = {};
  cd.teams.forEach(n => { t[n] = {team:n,pj:0,pg:0,pp:0,sf:0,sc:0,sd:0,pts:0}; });
  cd.matches.filter(m => m.played).forEach(m => {
    const sl = parseInt(m.scoreLocal), sv = parseInt(m.scoreVisitante);
    const lw = sl > sv;
    if (!t[m.local])     t[m.local]     = {team:m.local,    pj:0,pg:0,pp:0,sf:0,sc:0,sd:0,pts:0};
    if (!t[m.visitante]) t[m.visitante] = {team:m.visitante,pj:0,pg:0,pp:0,sf:0,sc:0,sd:0,pts:0};
    t[m.local].pj++;    t[m.visitante].pj++;
    t[m.local].sf+=sl;  t[m.local].sc+=sv;
    t[m.visitante].sf+=sv; t[m.visitante].sc+=sl;
    t[m.local].sd     = t[m.local].sf    - t[m.local].sc;
    t[m.visitante].sd = t[m.visitante].sf - t[m.visitante].sc;
    if (lw) { t[m.local].pg++;    t[m.local].pts+=2;    t[m.visitante].pp++; t[m.visitante].pts+=1; }
    else    { t[m.visitante].pg++; t[m.visitante].pts+=2; t[m.local].pp++;   t[m.local].pts+=1; }
  });
  return Object.values(t).sort((a,b) =>
    b.pts-a.pts || b.sd-a.sd || b.sf-a.sf || a.team.localeCompare(b.team)
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// PRINT
// ═══════════════════════════════════════════════════════════════════════════════
function printResults() {
  const logo = document.getElementById('headerLogo').src;
  let html = '';
  CATEGORIES.forEach((cat,ci) => {
    const cd = state.categories[cat.id];
    if (!cd.setupDone) return;
    const st = getStandings(cat.id);
    const byJ = {};
    cd.matches.forEach(m => { (byJ[m.jornada]=byJ[m.jornada]||[]).push(m); });
    const played = cd.matches.filter(m=>m.played).length;

    const mHtml = Object.keys(byJ).sort((a,b)=>a-b).map(j => {
      const rows = byJ[j].map(m => m.played
        ? `<div class="pm-row"><div class="pm-team">${escHtml(m.local)}</div><div class="pm-score">${m.scoreLocal} – ${m.scoreVisitante}</div><div class="pm-team r">${escHtml(m.visitante)}</div></div>`
        : `<div class="pm-row pm-pend"><div class="pm-team">${escHtml(m.local)}</div><div class="pm-score">— vs —</div><div class="pm-team r">${escHtml(m.visitante)}</div></div>`
      ).join('');
      return `<div class="j-lbl">Jornada ${j}</div>${rows}`;
    }).join('');

    html += `<div class="print-section">
      ${ci===0 ? `<div class="print-logo-row"><img src="${logo}"><div><h2>Liga Escolar de Voleibol</h2><p>Xogos Galegos Deportivos en Idade Escolar · XOGADE</p></div></div>` : ''}
      <div class="print-cat">${cat.label}</div>
      <div class="print-meta">${cd.format===1?'Liga 1 vuelta':'Liga 2 vueltas'} · ${played}/${cd.matches.length} partidos · 2 pts victoria / 1 pt derrota</div>
      <div class="print-cols">
        <div class="print-col"><div class="print-sub">Resultados</div>${mHtml}</div>
        <div class="print-col"><div class="print-sub">Clasificación</div>
          ${st.length > 0 ? `<table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>SF</th><th>SC</th><th>+/−</th><th>PTS</th></tr></thead><tbody>
            ${st.map((s,i)=>`<tr><td>${i+1}</td><td>${escHtml(s.team)}</td><td>${s.pj}</td><td>${s.pg}</td><td>${s.pp}</td><td>${s.sf}</td><td>${s.sc}</td><td>${s.sd>=0?'+':''}${s.sd}</td><td><strong>${s.pts}</strong></td></tr>`).join('')}
          </tbody></table>` : '<p style="color:#aaa;font-size:.8rem">Sin resultados</p>'}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

// ═══════════════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════════════
let _tt;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════
// Start app immediately as guest, loading data from Firebase
(async function init() {
  updateHeaderBtns();  // render guest buttons immediately
  document.getElementById('mainContent').innerHTML =
    '<div style="text-align:center;padding:80px 20px;color:var(--muted)">' +
    '<div style="font-size:2.5rem;margin-bottom:14px;animation:spin 1s linear infinite;display:inline-block">🏐</div>' +
    '<p style="font-family:Nunito,sans-serif;font-weight:700">Cargando datos...</p></div>';
  await loadState();
  render();
})();
</script>
